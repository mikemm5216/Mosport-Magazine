<!-- Internal tooling. The public reader pages never load anything under internal/.
     This page reads a MOSPORT-A world-analysis-package@1 file the operator picks; it
     fetches nothing, stores nothing and shows no number, interval or verdict. -->
<header class="ed-top"><span class="ed-brand">MOSPORT</span><span class="ed-title">A 賽前包檢視 · A World package inspector</span></header>
<div class="ed-banner">INTERNAL — 只檢查 A 交付的檔案，不是公開頁面、不是即時資料。Not a public page or live feed.</div>
<main class="ed-main">
  <label class="ap-pick">選擇 A 的 package JSON · Choose an A package file <input id="ap-file" type="file" accept="application/json,.json"></label>
  <label class="ap-pick">讀取時間 · Read at (UTC ISO) <input id="ap-now" type="text" size="28" spellcheck="false"></label>
  <section id="ap-out" aria-live="polite"><p>尚未載入 · No package loaded</p></section>
</main>
