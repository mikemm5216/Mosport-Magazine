<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSPORT 素材總覽</title>
<style>body{font:16px system-ui,sans-serif;background:#edf0f5;color:#14243a;margin:0}main{max-width:1200px;margin:auto;padding:28px}h1{margin:0}p{line-height:1.6}a{color:#164fc6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.logos{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}figure{margin:0;padding:16px;background:white;border:1px solid #d3dbe5;border-radius:10px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}.logos img{width:100px;height:100px;object-fit:contain}.flags img{width:96px;height:72px;object-fit:contain;border:1px solid #ddd}figcaption{font-size:14px;line-height:1.5}small{display:block;color:#526176}input{font:inherit;padding:12px;width:min(90%,500px);margin-bottom:18px}footer{margin-top:30px}header{background:#0b1729;color:white;padding:24px}header p{margin-bottom:0}</style></head>
<body><header><main><h1>MOSPORT 素材總覽</h1><p>CPBL 六隊隊徽 · 國家／地區旗幟 · 補充旗幟與符號</p></main></header><main>
<p><a href="candidate-v2.html">返回雜誌候選版</a> · 本頁為素材核對，不代表其他運動賽事資料已上線。</p>
<h2>CPBL 六隊</h2><p>聯盟官網原始 PNG；保留實際解析度。下載來源不等於第三方商標授權。</p><section id="cpbl" class="grid logos" aria-label="CPBL 隊徽"></section>
<h2>國家／地區旗幟</h2><p id="count"></p><label for="filter">搜尋名稱或代碼</label><br><input id="filter" type="search" placeholder="TW、Japan、United States…"><section id="flags" class="grid flags" aria-label="旗幟"></section>
<footer>旗幟來源：flag-icons 7.6.0 · <a href="assets/flags/LICENSE.txt">MIT 授權</a>。身分與來源索引：<a href="data/cpbl-team-registry.json">CPBL</a>／<a href="data/flag-registry.json">旗幟</a>。</footer>
</main><script src="data/cpbl-team-registry.js"></script><script src="data/flag-registry.js"></script><script>
(function(){
 function card(a,isFlag){var f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption'),s=document.createElement('small');i.src=a.file;i.alt=a.name;f.dataset.code=a.code||a.providerCode;f.dataset.search=(a.name+' '+f.dataset.code).toLowerCase();c.appendChild(document.createTextNode(a.name));s.textContent=isFlag?(a.code+(a.iso3166Alpha2?' · ISO':' · 補充符號')):(a.providerCode+' · '+a.width+'×'+a.height);c.appendChild(s);f.append(i,c);return f;}
 MOSPORT_CPBL_ASSETS.entries.forEach(function(a){document.getElementById('cpbl').appendChild(card(a,false));});
 MOSPORT_FLAG_ASSETS.entries.forEach(function(a){document.getElementById('flags').appendChild(card(a,true));});
 document.getElementById('count').textContent=MOSPORT_FLAG_ASSETS.isoCount+' 個 ISO 國家／地區，另有 '+MOSPORT_FLAG_ASSETS.additionalCount+' 個補充旗幟與符號。';
 document.getElementById('filter').addEventListener('input',function(){var q=this.value.trim().toLowerCase();document.querySelectorAll('#flags figure').forEach(function(f){f.hidden=f.dataset.search.indexOf(q)<0;f.style.display=f.hidden?'none':'';});});
})();
</script></body></html>
